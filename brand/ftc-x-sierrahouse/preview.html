<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow the Coast × Sierra House — animated lockup</title>
<style>
  :root { --ink:#101418; --paper:#f7f6f3; --line:#d9d6cf; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--paper); color:var(--ink); }
  header { padding:28px 24px 18px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 6px; font-size:16px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; }
  p.sub { margin:0; color:#6b6b6b; max-width:62ch; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:16px 24px; border-bottom:1px solid var(--line);
         position:sticky; top:0; background:var(--paper); z-index:5; }
  button { font:inherit; padding:7px 13px; border:1px solid var(--line); background:#fff; border-radius:999px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8a8a8a; margin-right:4px; }
  main { padding:24px; display:grid; gap:24px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); }
  figure { margin:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; }
  /* Mid-grey checks: light artwork and dark artwork both read against them,
     and the squares still say "this is transparent". */
  .stage { display:grid; place-items:center; padding:26px; min-height:330px;
           background-image:linear-gradient(45deg,#7d858d 25%,transparent 25%),linear-gradient(-45deg,#7d858d 25%,transparent 25%),
                            linear-gradient(45deg,transparent 75%,#7d858d 75%),linear-gradient(-45deg,transparent 75%,#7d858d 75%);
           background-size:18px 18px; background-position:0 0,0 9px,9px -9px,-9px 0; background-color:#98a0a7; }
  .stage.paper { background:var(--paper); }
  .stage.ink   { background:#032d47; }
  .stage.black { background:#000; }
  /* Sits outside this folder, so it degrades to a plain colour if the folder
     is copied somewhere else. */
  .stage.photo { background:#3d4a52 url("../../src/assets/coastal-path.jpg") center/cover; }
  .stage img, .stage video { max-width:100%; max-height:300px; height:auto; display:block; }
  figcaption { padding:10px 14px; border-top:1px solid var(--line); font-size:12px; color:#6b6b6b;
               display:flex; justify-content:space-between; gap:10px; }
  figcaption a { color:inherit; }
  .none { font-size:12px; color:#f2f2f2; background:rgba(0,0,0,.35); padding:4px 10px; border-radius:99px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Follow the Coast × Sierra House</h1>
  <p class="sub">Animated collaboration lockup. Every file below has a genuinely transparent background — the
  swatches change what sits <em>behind</em> the artwork, nothing is baked in.</p>
</header>

<div class="bar">
  <span class="label">Behind</span>
  <button data-bg="grid" aria-pressed="true">Transparent</button>
  <button data-bg="paper" aria-pressed="false">Paper</button>
  <button data-bg="ink" aria-pressed="false">Coast blue</button>
  <button data-bg="black" aria-pressed="false">Black</button>
  <button data-bg="photo" aria-pressed="false">Photo</button>
  <span style="flex:1"></span>
  <span class="label">Format</span>
  <button data-fmt="svg" aria-pressed="true">SVG</button>
  <button data-fmt="webm" aria-pressed="false">WebM</button>
  <button data-fmt="apng" aria-pressed="false">APNG</button>
  <button id="replay">Replay</button>
</div>

<main id="grid"></main>

<script>
const COLOURS = ['black', 'white', 'offwhite'];
const FITS = ['tight', 'square'];
const main = document.getElementById('grid');

// Everything in dist/. `loop` variants fade out and restart; the rest hold on
// the finished lockup.
const TILES = [];
for (const c of COLOURS) for (const f of FITS) for (const loop of [false, true]) {
  const base = `ftc-x-sierrahouse-${c}-${f}${loop ? '-loop' : ''}`;
  const t = { base, label: `${c} · ${f}${loop ? ' · loop' : ''}`, svg: `dist/svg/${base}.svg` };
  // webm covers every colour and fit; loops are built for black and white tight only
  if (!loop || (f === 'tight' && c !== 'offwhite')) t.webm = `dist/webm/${base}.webm`;
  if (f === 'tight' && c !== 'offwhite') {
    if (loop) t.apng = `dist/apng/${base}.png`;
    else t.mov = `dist/mov/${base}.mov`;
  }
  TILES.push(t);
}

for (const t of TILES) {
  const fig = document.createElement('figure');
  const links = ['svg', 'webm', 'mov', 'apng'].filter((k) => t[k])
    .map((k) => `<a href="${t[k]}">${k}</a>`).join(' · ');
  fig.innerHTML =
    `<div class="stage">` +
      `<img data-fmt="svg" src="${t.svg}" alt="${t.label}">` +
      (t.webm ? `<video data-fmt="webm" src="${t.webm}" autoplay muted playsinline loop hidden></video>` : '') +
      (t.apng ? `<img data-fmt="apng" src="${t.apng}" alt="${t.label} apng" hidden>` : '') +
    `</div>` +
    `<figcaption><span>${t.label}</span><span>${links}</span></figcaption>`;
  main.appendChild(fig);
}

const stages = () => document.querySelectorAll('.stage');
function press(group, value) {
  document.querySelectorAll(`button[data-${group}]`).forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset[group] === value)));
}
document.querySelectorAll('button[data-bg]').forEach((b) => b.addEventListener('click', () => {
  press('bg', b.dataset.bg);
  stages().forEach((s) => { s.className = 'stage' + (b.dataset.bg === 'grid' ? '' : ' ' + b.dataset.bg); });
}));
document.querySelectorAll('button[data-fmt]').forEach((b) => b.addEventListener('click', () => {
  press('fmt', b.dataset.fmt);
  document.querySelectorAll('.stage').forEach((s) => {
    let shown = 0;
    s.querySelectorAll('[data-fmt]').forEach((n) => {
      n.hidden = n.dataset.fmt !== b.dataset.fmt;
      if (!n.hidden) { shown++; if (n.tagName === 'VIDEO') { n.currentTime = 0; n.play(); } }
    });
    let note = s.querySelector('.none');
    if (!shown && !note) { note = document.createElement('span'); note.className = 'none'; s.appendChild(note); }
    if (note) { note.textContent = `not built as ${b.dataset.fmt}`; note.hidden = shown > 0; }
  });
}));
// SMIL restarts only on a fresh load, so re-point the src to replay.
document.getElementById('replay').addEventListener('click', () => {
  document.querySelectorAll('.stage img').forEach((i) => { const s = i.src; i.src = ''; i.src = s; });
  document.querySelectorAll('.stage video').forEach((v) => { v.currentTime = 0; v.play(); });
});
</script>
</body>
</html>
